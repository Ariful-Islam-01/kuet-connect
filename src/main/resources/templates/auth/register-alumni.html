<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Alumni Registration')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="d-flex align-items-center mb-3">
                    <a th:href="@{/register}" class="btn btn-sm btn-outline-secondary me-3"><i class="bi bi-arrow-left"></i></a>
                    <h3 class="fw-bold mb-0">Alumni Registration</h3>
                </div>
                <p class="text-muted small mb-4">Join the KUET Alumni Network to connect with fellow graduates and students.</p>

                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                <form th:action="@{/register/alumni}" th:object="${alumni}" method="post">
                    <h5 class="fw-bold text-primary mb-3">Personal & Academic Details</h5>

                    <div class="mb-3">
                        <label for="fullName" class="form-label fw-semibold">Full Name *</label>
                        <input type="text" class="form-control" th:field="*{fullName}" id="fullName" placeholder="e.g. Engr. Rafiqul Islam" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label for="studentId" class="form-label fw-semibold">Student ID / Roll *</label>
                            <input type="text" class="form-control" th:field="*{studentId}" id="studentId" placeholder="e.g. 1507023" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="department" class="form-label fw-semibold">Department *</label>
                            <select class="form-select" th:field="*{department}" id="department" required>
                                <option value="">-- Department --</option>
                                <option value="CSE">CSE</option>
                                <option value="EEE">EEE</option>
                                <option value="ME">ME</option>
                                <option value="CE">CE</option>
                                <option value="ECE">ECE</option>
                                <option value="BME">BME</option>
                                <option value="MSE">MSE</option>
                                <option value="IPE">IPE</option>
                                <option value="TE">TE</option>
                                <option value="LE">LE</option>
                                <option value="URP">URP</option>
                                <option value="BECM">BECM</option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                        </div>

                        <div class="col-md-2">
                            <label for="batch" class="form-label fw-semibold">Batch *</label>
                            <input type="text" class="form-control" th:field="*{batch}" id="batch" placeholder="2k15" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('batch')}" th:errors="*{batch}"></div>
                        </div>

                        <div class="col-md-2">
                            <label for="passingYear" class="form-label fw-semibold">Pass Year *</label>
                            <input type="number" class="form-control" th:field="*{passingYear}" id="passingYear" placeholder="2020" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('passingYear')}" th:errors="*{passingYear}"></div>
                        </div>
                    </div>

                    <h5 class="fw-bold text-primary mt-4 mb-3">Professional Information (Optional)</h5>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="currentDesignation" class="form-label fw-semibold">Current Designation</label>
                            <input type="text" class="form-control" th:field="*{currentDesignation}" id="currentDesignation" placeholder="e.g. Lead Engineer">
                        </div>

                        <div class="col-md-6">
                            <label for="currentCompany" class="form-label fw-semibold">Company / Organization</label>
                            <input type="text" class="form-control" th:field="*{currentCompany}" id="currentCompany" placeholder="e.g. Samsung R&D">
                        </div>
                    </div>

                    <h5 class="fw-bold text-primary mt-4 mb-3">Account Security</h5>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address *</label>
                        <input type="email" class="form-control" th:field="*{email}" id="email" placeholder="your.email@gmail.com" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="password" class="form-label fw-semibold">Password *</label>
                            <input type="password" class="form-control" th:field="*{password}" id="password" placeholder="At least 6 characters" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="confirmPassword" class="form-label fw-semibold">Confirm Password *</label>
                            <input type="password" class="form-control" th:field="*{confirmPassword}" id="confirmPassword" placeholder="Confirm password" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-3">Register Alumni Account</button>
                </form>

                <div class="text-center mt-4">
                    <p class="text-muted small mb-0">Already have an account? <a th:href="@{/login}" class="text-primary fw-semibold">Sign in</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
