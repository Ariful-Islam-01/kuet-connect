<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Student Registration')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="d-flex align-items-center mb-3">
                    <a th:href="@{/register}" class="btn btn-sm btn-outline-secondary me-3"><i class="bi bi-arrow-left"></i></a>
                    <h3 class="fw-bold mb-0">Student Registration</h3>
                </div>
                <p class="text-muted small mb-4">Fill out the form below to create your KUET Student account.</p>

                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                <form th:action="@{/register/student}" th:object="${student}" method="post">
                    <div class="mb-3">
                        <label for="fullName" class="form-label fw-semibold">Full Name *</label>
                        <input type="text" class="form-control" th:field="*{fullName}" id="fullName" placeholder="e.g. S. M. Farhan" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="studentId" class="form-label fw-semibold">Student Roll / ID *</label>
                            <input type="text" class="form-control" th:field="*{studentId}" id="studentId" placeholder="e.g. 2007015" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="department" class="form-label fw-semibold">Department *</label>
                            <select class="form-select" th:field="*{department}" id="department" required>
                                <option value="">-- Select Department --</option>
                                <option value="CSE">Computer Science and Engineering (CSE)</option>
                                <option value="EEE">Electrical and Electronic Engineering (EEE)</option>
                                <option value="ME">Mechanical Engineering (ME)</option>
                                <option value="CE">Civil Engineering (CE)</option>
                                <option value="ECE">Electronics and Communication Engineering (ECE)</option>
                                <option value="BME">Biomedical Engineering (BME)</option>
                                <option value="MSE">Materials Science and Engineering (MSE)</option>
                                <option value="IPE">Industrial and Production Engineering (IPE)</option>
                                <option value="TE">Textile Engineering (TE)</option>
                                <option value="LE">Leather Engineering (LE)</option>
                                <option value="URP">Urban and Regional Planning (URP)</option>
                                <option value="BECM">Building Engineering & Construction Management (BECM)</option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address *</label>
                        <input type="email" class="form-control" th:field="*{email}" id="email" placeholder="student@stud.kuet.ac.bd" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="password" class="form-label fw-semibold">Password *</label>
                            <input type="password" class="form-control" th:field="*{password}" id="password" placeholder="At least 6 characters" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="confirmPassword" class="form-label fw-semibold">Confirm Password *</label>
                            <input type="password" class="form-control" th:field="*{confirmPassword}" id="confirmPassword" placeholder="Confirm password" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-kuet w-100 py-2 fw-semibold rounded-3">Register Student Account</button>
                </form>

                <div class="text-center mt-4">
                    <p class="text-muted small mb-0">Already registered? <a th:href="@{/login}" class="text-primary fw-semibold">Sign in</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
