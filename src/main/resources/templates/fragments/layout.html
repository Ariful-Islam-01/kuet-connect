<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - KUET Connect'">KUET Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --kuet-primary: #0d47a1;
            --kuet-secondary: #1976d2;
            --kuet-accent: #00897b;
        }
        .navbar-kuet {
            background-color: var(--kuet-primary);
        }
        .btn-kuet {
            background-color: var(--kuet-primary);
            color: white;
        }
        .btn-kuet:hover {
            background-color: #0a3880;
            color: white;
        }
        .badge-verified {
            background-color: var(--kuet-accent);
            color: white;
        }
    </style>
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-kuet shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-mortarboard-fill me-2"></i>KUET Connect
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="bi bi-house-door me-1"></i>Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/alumni/directory}"><i class="bi bi-people me-1"></i>Alumni Directory</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                <!-- Unauthenticated (Guest) Navigation -->
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}"><i class="bi bi-box-arrow-in-right me-1"></i>Login</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-outline-light btn-sm ms-2" th:href="@{/register}">Register</a>
                </li>

                <!-- Authenticated User Navigation -->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle text-white d-flex align-items-center" href="#" id="userDrop" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle fs-5 me-1"></i>
                        <span sec:authentication="name" class="fw-semibold">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li sec:authorize="hasRole('ALUMNI')">
                            <a class="dropdown-item" th:href="@{/alumni/profile/edit}"><i class="bi bi-pencil-square me-2"></i>Edit Alumni Profile</a>
                        </li>
                        <li sec:authorize="hasRole('ALUMNI')">
                            <a class="dropdown-item" th:href="@{/alumni/verify}"><i class="bi bi-patch-check me-2"></i>Verification Status</a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="bg-light text-muted py-4 mt-auto border-top">
    <div class="container text-center">
        <p class="mb-1">&copy; 2026 KUET Connect. Khulna University of Engineering & Technology.</p>
        <small>Authentication & Alumni Management Module</small>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
