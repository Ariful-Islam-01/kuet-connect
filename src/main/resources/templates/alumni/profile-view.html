<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Alumni Profile')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="d-flex justify-content-between align-items-start mb-4">
                    <div class="d-flex align-items-center">
                        <div class="rounded-circle bg-primary-subtle text-primary d-flex align-items-center justify-content-center me-3" style="width: 72px; height: 72px; font-size: 2rem;">
                            <i class="bi bi-person"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-1" th:text="${profile.user.fullName}">Alumni Full Name</h3>
                            <div class="d-flex gap-2 align-items-center">
                                <span class="badge bg-primary" th:text="${profile.user.department}">CSE</span>
                                <span class="badge bg-secondary" th:if="${profile.batch != null}" th:text="'Batch ' + ${profile.batch}">Batch 2k16</span>
                                <span class="badge bg-success" th:if="${profile.verified}"><i class="bi bi-patch-check-fill me-1"></i>Verified Alumni</span>
                            </div>
                        </div>
                    </div>
                    <a th:href="@{/alumni/directory}" class="btn btn-outline-secondary btn-sm rounded-pill"><i class="bi bi-arrow-left me-1"></i>Back to Directory</a>
                </div>

                <hr>

                <div class="row g-4 my-2">
                    <div class="col-md-6">
                        <h6 class="text-muted fw-bold text-uppercase small">Professional Information</h6>
                        <p class="mb-1 fw-semibold" th:if="${profile.currentDesignation != null}" th:text="${profile.currentDesignation}">Designation</p>
                        <p class="mb-1 text-muted" th:if="${profile.currentCompany != null}"><i class="bi bi-building me-1"></i><span th:text="${profile.currentCompany}">Company</span></p>
                        <p class="mb-1 text-muted" th:if="${profile.industry != null}"><i class="bi bi-briefcase me-1"></i><span th:text="${profile.industry}">Industry</span></p>
                        <p class="mb-1 text-muted" th:if="${profile.location != null}"><i class="bi bi-geo-alt me-1"></i><span th:text="${profile.location}">Location</span></p>
                    </div>

                    <div class="col-md-6">
                        <h6 class="text-muted fw-bold text-uppercase small">Academic Background</h6>
                        <p class="mb-1"><i class="bi bi-mortarboard me-1 text-primary"></i> <span th:text="${profile.degree != null ? profile.degree : 'Degree in ' + profile.user.department}">Degree</span></p>
                        <p class="mb-1 text-muted" th:if="${profile.passingYear != null}"><i class="bi bi-calendar-check me-1"></i> Graduation: <span th:text="${profile.passingYear}">2021</span></p>
                        <p class="mb-1 text-muted"><i class="bi bi-envelope me-1"></i> <span th:text="${profile.user.email}">email@domain.com</span></p>
                    </div>
                </div>

                <div class="mt-4" th:if="${profile.bio != null and !profile.bio.empty}">
                    <h6 class="text-muted fw-bold text-uppercase small">About</h6>
                    <p class="text-secondary" th:text="${profile.bio}">Biography details...</p>
                </div>

                <div class="mt-4 pt-3 border-top d-flex gap-3">
                    <a th:if="${profile.linkedinUrl != null and !profile.linkedinUrl.empty}" th:href="${profile.linkedinUrl}" target="_blank" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-linkedin me-1"></i>LinkedIn Profile
                    </a>
                    <a th:if="${profile.githubUrl != null and !profile.githubUrl.empty}" th:href="${profile.githubUrl}" target="_blank" class="btn btn-outline-dark btn-sm">
                        <i class="bi bi-github me-1"></i>GitHub Profile
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
